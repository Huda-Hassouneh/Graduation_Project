# Visual / collision geometry for the Gazebo model of m400_reference_quad (Milestone 3).
# These values affect ONLY the 3D appearance and contact shapes in Gazebo. They are not read by
# the Python simulator. Mass, inertia, rotor hub positions, rotor diameter, spin directions and
# the central-body / battery boxes come from config/aircraft/m400_reference_quad.yaml.
#
# This is an M400-INSPIRED QUADROTOR, not a DJI Matrice 400 model. It is not a digital twin.
# Apart from the published envelope, every shape below is an assumed placeholder.
# Positions are in the geometric frame G (docs/coordinate_frames.md); the generator shifts them
# by -r_CoM so the SDF link origin is the centre of mass.
aircraft: m400_reference_quad
arm:
  width: {value: 0.045, units: m, source: assumed}
  height: {value: 0.035, units: m, source: assumed}
motor:
  radius: {value: 0.040, units: m, source: assumed}
  height: {value: 0.060, units: m, source: assumed}
rotor_disk:
  thickness: {value: 0.006, units: m, source: assumed, note: "visual swept-disk only; diameter from the aircraft config"}
landing_gear:
  bottom_z: {value: -0.33, units: m, source: assumed, note: "chosen so gear-to-mast height equals the published 480 mm"}
  track: {value: 0.50, units: m, source: assumed}
  skid_length: {value: 0.60, units: m, source: assumed}
  skid_section: {value: 0.025, units: m, source: assumed}
extra_boxes:
  - name: payload_gimbal
    position: {value: [0.40, 0.0, -0.24], units: m, source: assumed, note: "forward payload placeholder; front face at x = 0.49 m"}
    size: {value: [0.18, 0.15, 0.15], units: m, source: assumed}
  - name: gnss_mast
    position: {value: [0.0, 0.0, 0.1125], units: m, source: assumed, note: "top-mounted antenna placeholder; top at z = 0.15 m"}
    size: {value: [0.06, 0.06, 0.075], units: m, source: assumed}
published_envelope:
  # DJI spec: unfolded L x W x H with landing gear (docs/aircraft_reference.md, section 2).
  size: {value: [0.98, 0.76, 0.48], units: m, source: manufacturer, note: "980 x 760 x 480 mm unfolded, with landing gear"}
  centre_xy: {value: [0.0, 0.0], units: m, source: assumed, note: "placement relative to the hubs is not published; centred on G"}
  # Vertical placement is derived: the envelope bottom sits at landing_gear.bottom_z.
