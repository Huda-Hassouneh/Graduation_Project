  self_heating: {value: "battery heating and low-temperature self-heating charging", units: text, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  bms_firmware: {value: "v16.00.00.63", units: text, category: VERIFIED_OFFICIAL, sources: [DJI-RN], confidence: high}
