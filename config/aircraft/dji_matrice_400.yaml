# ----------------------------------------------------------------------------------------------
# 8. Simulation-only assumptions (no manufacturer counterpart)
# ----------------------------------------------------------------------------------------------
simulation_assumptions:
  gravity: {value: 9.80665, units: m/s^2, category: SIMULATION_ASSUMPTION, sources: [ISO-2533], confidence: high, range: [9.78, 9.83], rationale: "standard gravity", sensitivity: "none within range"}
  air_density_sea_level: {value: 1.225, units: kg/m^3, category: SIMULATION_ASSUMPTION, sources: [ISO-2533], confidence: high, range: [1.0, 1.3], rationale: "ISA sea level; site altitude/temperature handled by environment/atmosphere.py", sensitivity: "thrust and power scale with density"}
  drag_linear: {value: [0.0, 0.0, 0.0], units: N s/m, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.0, 0.5], rationale: "lumped model uses quadratic drag only", sensitivity: "low-speed disturbance rejection"}
  drag_quadratic: {value: [0.107, 0.107, 0.30], units: N s^2/m^2, category: ENGINEERING_ESTIMATE, sources: [DJI-SPEC, DERIVED], confidence: low, range: [0.05, 0.40],
                   rationale: "horizontal: m g tan(35 deg) / (25 m/s)^2 assumes the published top speed is drag-limited at the published max pitch (upper-bound argument); vertical assumed",
                   derivation: "9.74 * 9.80665 * tan(35 deg) / 25^2", sensitivity: "wind disturbance force ~ linear in coefficient"}
  avionics_power: {value: 60.0, units: W, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [30.0, 120.0], rationale: "flight controller, sensors (LiDAR, radar, vision), transmission; not published", sensitivity: "absorbed in C_P calibration for hover; matters at low thrust"}
  usable_energy_fraction: {value: 0.95, units: "-", category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.85, 1.0], rationale: "fraction of 977 Wh available before cutoff in the 53 min hover claim", sensitivity: "endurance, C_P calibration"}
  battery_r0: {value: 0.06, units: ohm, category: ENGINEERING_ESTIMATE, sources: [ENG], confidence: low, range: [0.03, 0.12],
               rationale: "13S x Np pack of high-energy Li-ion cells (~15-25 mOhm each) plus wiring; Np not published", sensitivity: "voltage sag (~1.3 V at hover); thrust headroom at low SoC"}
  battery_r1: {value: 0.03, units: ohm, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.01, 0.08], rationale: "1-RC polarisation branch", sensitivity: "transient sag"}
  battery_c1: {value: 2000.0, units: F, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [500.0, 5000.0], rationale: "polarisation time constant R1*C1 = 60 s", sensitivity: "transient sag"}
  battery_cell_cutoff: {value: 3.0, units: V, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: medium, range: [2.8, 3.3], rationale: "generic Li-ion cutoff; DJI threshold unknown", sensitivity: "end of usable energy"}
  battery_ocv_curve:
    soc: {value: [0.0, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 1.0], units: "-", category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.0, 1.0], rationale: "generic Li-ion (NMC-class) open-circuit curve; DJI cell chemistry details not published", sensitivity: "voltage-SoC mapping"}
    cell_voltage: {value: [3.00, 3.30, 3.45, 3.56, 3.63, 3.68, 3.73, 3.80, 3.88, 3.97, 4.07, 4.20], units: V, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [3.0, 4.2], rationale: "endpoints match the published 54.6 V / 13 = 4.2 V max; midpoint ~3.71 V matches 48.23 V / 13", sensitivity: "voltage-SoC mapping"}
  ground_contact:
    stiffness: {value: 20000.0, units: N/m, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [10000.0, 60000.0], rationale: "~5 mm static compression; numerical stability at dt = 4 ms", sensitivity: "touchdown transients only"}
    damping_ratio: {value: 0.7, units: "-", category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.3, 1.0], rationale: "well-damped landing gear", sensitivity: "touchdown bounce"}
    friction_coefficient: {value: 0.6, units: "-", category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.3, 1.0], rationale: "skid on a concrete pad", sensitivity: "sliding at touchdown"}
  vehicle_clearance_radius: {value: 0.853, units: m, category: ENGINEERING_ESTIMATE, sources: [DERIVED], confidence: medium, range: [0.80, 0.90],
                             rationale: "hub radius 0.535 m + rotor radius 0.3175 m (+ rounding)", derivation: "0.535 + 0.635 / 2", sensitivity: "minimum facade clearance constraint"}
  sensors:
    imu:
      rate: {value: 250.0, units: Hz, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: medium, range: [200.0, 1000.0], rationale: "equal to the control rate", sensitivity: "estimator propagation step"}
      gyro_noise_density: {value: 0.00025, units: rad/s/sqrt(Hz), category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.0001, 0.001], rationale: "class-representative industrial MEMS (~0.014 deg/s/sqrt(Hz))", sensitivity: "attitude noise"}
      gyro_bias_rw: {value: 0.00002, units: rad/s^2/sqrt(Hz), category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.000005, 0.0001], rationale: "MEMS bias instability class", sensitivity: "attitude drift without heading aid"}
      accel_noise_density: {value: 0.0015, units: m/s^2/sqrt(Hz), category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.0005, 0.005], rationale: "class-representative MEMS (~150 ug/sqrt(Hz))", sensitivity: "velocity noise, thrust-gain residual noise"}
      accel_bias_rw: {value: 0.0002, units: m/s^3/sqrt(Hz), category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.00005, 0.001], rationale: "MEMS class", sensitivity: "vertical drift without GNSS/baro"}
      vibration_accel_std: {value: 0.05, units: m/s^2, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.0, 0.3], rationale: "residual rotor vibration after isolation", sensitivity: "accelerometer residual noise"}
    gnss:
