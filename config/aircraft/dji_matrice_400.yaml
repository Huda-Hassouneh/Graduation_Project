  max_flight_distance: {value: 49.0, units: km, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  charging_station: {value: "BS100: 11.8 kg, 605x410x250 mm, charges 3 TB100 + 2 WB37; TB100 ~45 min fast / ~110 min silent at 220 V", units: text, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  rth_battery_reserve_setting: {value: "user-settable RTH battery reserve (Battery Settings)", units: text, category: VERIFIED_OFFICIAL, sources: [DJI-RN], confidence: high}

