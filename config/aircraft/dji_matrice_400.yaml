      bias_rw: {value: 0.005, units: m/sqrt(s), category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.0, 0.02], rationale: "thermal / weather drift", sensitivity: "slow altitude drift"}
