  max_charge_voltage: {value: 54.6, units: V, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  capacity: {value: 20.254, units: Ah, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  energy: {value: 977.0, units: Wh, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  mass: {value: 4.72, units: kg, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  dimensions: {value: null, units: m, category: UNKNOWN, sources: [DJI-SPEC], confidence: high, note: "not listed on the spec page"}
  max_discharge_rate: {value: 4.0, units: C, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  max_charge_rate: {value: 2.0, units: C, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  cycle_count: {value: 400, units: cycles, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
