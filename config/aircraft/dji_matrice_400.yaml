# DJI Matrice 400 — traceable specification database and simulation configuration (schema v2).
#
# This file is the single source of truth for the company-platform model. It is NOT a digital
# twin: DJI does not publish propulsion curves, inertia, CoM, IMU specifications or flight-control
# internals. Every leaf parameter carries:
#   value       numeric/string value, or null when unknown / not publicly disclosed
#   units       SI units ("-" for dimensionless, "text" for strings)
#   category    VERIFIED_OFFICIAL | VERIFIED_SECONDARY | ENGINEERING_ESTIMATE |
#               SIMULATION_ASSUMPTION | UNKNOWN | NOT_PUBLICLY_DISCLOSED
#   sources     ids from the `sources` section (documented in docs/DJI_MATRICE_400_SOURCE_REGISTER.md)
#   confidence  high | medium | low
# Estimates and assumptions additionally carry `range: [min, max]`, `rationale` and `sensitivity`.
# A null-valued parameter that the simulation needs names its stand-in with `simulation_value`
# (a dotted path to an ENGINEERING_ESTIMATE / SIMULATION_ASSUMPTION parameter). Nothing is
# silently replaced. Regenerate the JSON export with `python3 scripts/export_m400_spec.py`.
#
# Frames: geometric frame G (origin at the geometric centre of the rotor hubs projected to the
# body centreline, FLU axes); the loader shifts everything by -r_CoM (docs/coordinate_frames.md).

schema_version: 2
name: dji_matrice_400
model_class: aircraft_reference_geometry
display_name: "DJI Matrice 400 (quadrotor reference model; not a digital twin)"

sources:
  DJI-SPEC: {title: "Matrice 400 - Specs", publisher: DJI, url: "https://enterprise.dji.com/matrice-400/specs", accessed: "2026-11-01", type: official}
  DJI-RN: {title: "Matrice 400 Release Notes (released 2026.05.07)", publisher: DJI, url: "https://dl.djicdn.com/downloads/Matrice_400/RN/20260507/Matrice_400_Release_Notes_en.pdf", accessed: "2026-11-01", type: official}
  DJI-MTM: {title: "Matrice 400 Maintenance Manual v1.0 (not machine-readable here; content known only from a search-engine summary)", publisher: DJI, url: "https://dl.djicdn.com/downloads/Matrice_400/MTM/Matrice_400_Maintenance_Manual_v1.0_en.pdf", accessed: "2026-10-28", type: secondary}
  DJI-STORE-PROP: {title: "DJI Matrice 400 2510F Propeller (DJI Store product page)", publisher: DJI, url: "https://store.dji.com/hu/product/dji-matrice-m400-2510f-propeller", accessed: "2026-10-30", type: official}
  DJI-MSDK-GH: {title: "DJI Mobile SDK for Android V5 (README, supported products, v5.18.0)", publisher: DJI (dji-sdk GitHub organisation), url: "https://github.com/dji-sdk/Mobile-SDK-Android-V5", accessed: "2026-11-01", type: official}
  DJI-MSDK-VS: {title: "MSDK V5 API reference: VirtualStickFlightControlParam / IVirtualStickManager", publisher: DJI, url: "https://developer.dji.com/api-reference-v5/android-api/Components/IVirtualStickManager/Value_FlightController_Struct_VirtualStickFlightControlParam.html", accessed: "2026-11-01", type: secondary, note: "page is JavaScript-rendered; content known from search-engine extracts of the official page"}
  DJI-DEV-RN: {title: "DJI Developer portal: Payload SDK / Cloud API / MSDK release entries", publisher: DJI, url: "https://developer.dji.com", accessed: "2026-11-01", type: secondary, note: "JavaScript-rendered; content known from search-engine extracts of the official page"}
  DJI-PSDK-GH: {title: "DJI Payload SDK (GitHub README, V3.17.0 badge) and dji_flight_controller.h", publisher: DJI (dji-sdk GitHub organisation), url: "https://github.com/dji-sdk/Payload-SDK", accessed: "2026-11-01", type: official}
  ISO-2533: {title: "ISO 2533:1975 Standard Atmosphere (troposphere relations)", publisher: ISO, url: "https://www.iso.org/standard/7472.html", accessed: "2026-11-01", type: standard, note: "standard relations; tables to be checked in the literature review"}
  DERIVED: {title: "Derived in this repository from cited values (see `derivation` field)", publisher: this project, url: "docs/DJI_MATRICE_400_TECHNICAL_SPECIFICATION.md", accessed: "2026-11-01", type: derived}
  ENG: {title: "Engineering judgement documented in the parameter's `rationale` field", publisher: this project, url: "docs/ASSUMPTIONS_AND_LIMITATIONS.md", accessed: "2026-11-01", type: assumption}

# ----------------------------------------------------------------------------------------------
# 1. Physical geometry
# ----------------------------------------------------------------------------------------------
geometry:
  configuration: {value: "quadrotor, symmetric X, foldable arms", units: text, category: VERIFIED_SECONDARY, sources: [DJI-MTM, DJI-SPEC, DERIVED], confidence: high,
                  note: "rotor count is not stated on the spec page; maintenance-manual summary numbers motors 1-4; a coplanar hexagon at the published 1070 mm wheelbase would overlap the 635 mm discs (adjacent hub spacing 535 mm), a square X gives 757 mm = published 760 mm width"}
  n_rotors: {value: 4, units: "-", category: VERIFIED_SECONDARY, sources: [DJI-MTM, DERIVED], confidence: high}
  diagonal_wheelbase: {value: 1.070, units: m, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  dimensions_unfolded_lwh: {value: [0.980, 0.760, 0.480], units: m, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high, note: "with landing gear"}
  dimensions_folded_lwh: {value: [0.490, 0.490, 0.480], units: m, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high, note: "with landing gear and gimbal"}
  arm_length: {value: 0.535, units: m, category: ENGINEERING_ESTIMATE, sources: [DJI-SPEC, DERIVED], confidence: high, range: [0.530, 0.540],
               rationale: "hub-to-centre distance = half the diagonal wheelbase for a symmetric X", derivation: "1.070 / 2", sensitivity: "roll/pitch control authority scales linearly"}
  rotor_azimuths: {value: [-45.0, 45.0, 135.0, -135.0], units: deg, category: SIMULATION_ASSUMPTION, sources: [DJI-MTM, ENG], confidence: medium, range: [-135.0, 135.0],
                   rationale: "symmetric X; numbering counter-clockwise from front-right (motor 1 front-right per the maintenance-manual summary)", sensitivity: "layout fixed by symmetry"}
  spin_dirs: {value: [1, -1, 1, -1], units: "-", category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [-1, 1],
              rationale: "diagonal pairs must counter-rotate for yaw balance; absolute assignment UNVERIFIED (secondary summary contradicts itself)", sensitivity: "flips the sign of the yaw allocation row only; no effect on any metric"}
  rotor_height: {value: 0.05, units: m, category: ENGINEERING_ESTIMATE, sources: [ENG], confidence: low, range: [0.0, 0.12],
                 rationale: "rotor plane slightly above the battery/body centre; not published", sensitivity: "couples horizontal drag/rotor forces into pitch moments; negligible in the current lumped model"}
  frontal_reference_area: {value: null, units: m^2, category: NOT_PUBLICLY_DISCLOSED, sources: [DJI-SPEC], confidence: high,
                           simulation_value: simulation_assumptions.drag_quadratic, note: "drag represented by a lumped coefficient instead"}
  landing_gear:
    bottom_z: {value: -0.33, units: m, category: SIMULATION_ASSUMPTION, sources: [DJI-SPEC, ENG], confidence: medium, range: [-0.36, -0.30],
               rationale: "chosen so gear-to-mast height equals the published 480 mm", sensitivity: "only ground-contact geometry"}
    track: {value: 0.50, units: m, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.40, 0.60], rationale: "lateral skid spacing; not published", sensitivity: "landing tip-over margin"}
    skid_length: {value: 0.60, units: m, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.45, 0.75], rationale: "not published", sensitivity: "landing pitch stability"}
  centre_of_gravity: {value: null, units: m, category: NOT_PUBLICLY_DISCLOSED, sources: [DJI-SPEC], confidence: high,
                      simulation_value: mass_properties.components, note: "CoM follows from the assumed component layout"}

# ----------------------------------------------------------------------------------------------
# 2. Mass properties
# ----------------------------------------------------------------------------------------------
mass_properties:
  takeoff_mass_with_battery: {value: 9.74, units: kg, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high, note: "9740 +/- 40 g, with propellers and battery; excludes payload"}
  mass_without_battery: {value: 5.02, units: kg, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high, note: "5020 +/- 20 g, with propellers"}
  max_takeoff_mass: {value: 15.8, units: kg, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  max_payload: {value: 6.0, units: kg, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high, note: "documentation only; measured at the third gimbal connector at sea level; decreases with altitude"}
  total_mass: {value: 9.74, units: kg, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high, note: "simulation baseline mass = takeoff mass with one TB100, no payload"}
  inertia: {value: null, units: kg m^2, category: NOT_PUBLICLY_DISCLOSED, sources: [DJI-SPEC], confidence: high,
            simulation_value: mass_properties.components, note: "derived from assumed lumped components; uncertainty +/-30 % (sensitivity runs)"}
  inertia_uncertainty_fraction: {value: 0.30, units: "-", category: ENGINEERING_ESTIMATE, sources: [ENG], confidence: low, range: [0.15, 0.50],
                                 rationale: "lumped-box estimates of unmeasured airframes typically differ from pendulum measurements by tens of percent", sensitivity: "attitude-loop bandwidth and torque-disturbance residual scaling"}
  components:
    - name: battery_tb100
      mass: {value: 4.72, units: kg, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
      position: {value: [0.0, 0.0, 0.0], units: m, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [-0.05, 0.05], rationale: "centred under the hub plane", sensitivity: "CoM offset -> constant torque disturbance"}
      size: {value: [0.30, 0.20, 0.10], units: m, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.08, 0.32], rationale: "battery dimensions not published", sensitivity: "inertia only"}
    - name: motor_propeller
      at_rotors: 1.0
      mass: {value: 0.40, units: kg, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.30, 0.55], rationale: "7510-class motor + 25 in folding propeller; not published", sensitivity: "roll/pitch inertia (dominant term)"}
    - name: arm
      at_rotors: 0.5
      mass: {value: 0.25, units: kg, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.15, 0.35], rationale: "folding carbon arm with hinge; not published", sensitivity: "roll/pitch inertia"}
    - name: central_body
      mass: {value: remainder, units: kg, category: ENGINEERING_ESTIMATE, sources: [DERIVED], confidence: medium, derivation: "total_mass minus listed components"}
      position: {value: [0.0, 0.0, -0.05], units: m, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [-0.10, 0.0], rationale: "avionics and gimbal mount below the hub plane", sensitivity: "CoM height"}
      size: {value: [0.45, 0.35, 0.25], units: m, category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.2, 0.5], rationale: "visual envelope of the fuselage", sensitivity: "yaw inertia"}

# ----------------------------------------------------------------------------------------------
# 3. Propulsion
# ----------------------------------------------------------------------------------------------
propulsion:
  n_motors: {value: 4, units: "-", category: VERIFIED_SECONDARY, sources: [DJI-MTM, DERIVED], confidence: high}
  motor_model: {value: "7510", units: text, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high}
  motor_manufacturer: {value: null, units: text, category: NOT_PUBLICLY_DISCLOSED, sources: [DJI-SPEC], confidence: high}
  motor_type: {value: "brushless outrunner (assumed)", units: text, category: ENGINEERING_ESTIMATE, sources: [ENG], confidence: medium, rationale: "universal for electric multirotors of this class; not stated by DJI", sensitivity: "none (equivalent model)"}
  motor_kv_resistance_torque_constant: {value: null, units: "-", category: NOT_PUBLICLY_DISCLOSED, sources: [DJI-SPEC], confidence: high, simulation_value: propulsion.motor_time_constant, note: "first-order speed lag used instead of an electrical motor model"}
  esc: {value: null, units: text, category: NOT_PUBLICLY_DISCLOSED, sources: [DJI-SPEC], confidence: high}
  propeller_model: {value: "2510F", units: text, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC, DJI-STORE-PROP], confidence: high}
  rotor_diameter: {value: 0.635, units: m, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high, note: "25 inch"}
  propeller_folding: {value: "foldable, sold as CW/CCW pair", units: text, category: VERIFIED_OFFICIAL, sources: [DJI-STORE-PROP], confidence: medium}
  propeller_pitch: {value: null, units: m, category: NOT_PUBLICLY_DISCLOSED, sources: [DJI-SPEC], confidence: high, simulation_value: propulsion.thrust_coefficient}
  max_thrust: {value: null, units: N, category: NOT_PUBLICLY_DISCLOSED, sources: [DJI-SPEC], confidence: high, simulation_value: propulsion.max_thrust_to_weight}
  motor_rpm: {value: null, units: rpm, category: NOT_PUBLICLY_DISCLOSED, sources: [DJI-SPEC], confidence: high}
  propulsion_voltage_nominal: {value: 48.23, units: V, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high, note: "TB100 standard voltage (13S Li-ion)"}
  thrust_coefficient: {value: 0.10, units: "-", category: ENGINEERING_ESTIMATE, sources: [ENG], confidence: low, range: [0.08, 0.12],
                       rationale: "typical static C_T of fixed-pitch multirotor propellers; gives a plausible ~2080 rpm hover for 25 in", sensitivity: "sets hover rotor speed; hover power is calibrated separately (C_P), so tracking metrics are insensitive"}
  power_coefficient: {value: 0.03774, units: "-", category: ENGINEERING_ESTIMATE, sources: [DJI-SPEC, DERIVED], confidence: medium, range: [0.033, 0.045],
                      rationale: "calibrated so modelled hover electrical power = 0.95 x 977 Wh / 53 min = 1050.7 W at 9.74 kg (scripts/calibrate_m400_power.py)",
                      derivation: "shaft = (P_el - P_avionics) * eta; k_m = shaft / (n Omega_h^3); C_P = k_m (2 pi)^3 / (rho D^5)",
                      sensitivity: "energy and endurance scale ~linearly; range covers usable fraction 0.90-1.00 and eta 0.75-0.85"}
  max_thrust_to_weight: {value: 1.6, units: "-", category: ENGINEERING_ESTIMATE, sources: [ENG], confidence: low, range: [1.4, 2.2],
                         rationale: "at the 15.8 kg MTOW; DJI publishes MTOW and 10 m/s climb but no thrust figure", sensitivity: "saturation margin, fault tolerance to thrust loss"}
  max_thrust_reference_mass: {value: 15.8, units: kg, category: VERIFIED_OFFICIAL, sources: [DJI-SPEC], confidence: high, note: "MTOW used as the thrust reference"}
  idle_speed_fraction: {value: 0.15, units: "-", category: SIMULATION_ASSUMPTION, sources: [ENG], confidence: low, range: [0.10, 0.25], rationale: "armed idle", sensitivity: "minimum thrust bound in allocation"}
  motor_time_constant: {value: 0.06, units: s, category: ENGINEERING_ESTIMATE, sources: [ENG], confidence: low, range: [0.03, 0.12],
                        rationale: "large (25 in) rotors respond more slowly than small-drone rotors (~0.02-0.04 s)", sensitivity: "rate-loop bandwidth; identifiable online only with thrust excitation"}
  propulsion_efficiency: {value: 0.80, units: "-", category: ENGINEERING_ESTIMATE, sources: [ENG], confidence: low, range: [0.70, 0.90],
                          rationale: "lumped motor+ESC electrical-to-shaft efficiency", sensitivity: "absorbed in the C_P calibration for hover"}

# ----------------------------------------------------------------------------------------------
